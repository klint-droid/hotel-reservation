<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <style>
    :root {
      --brand-green: #1B4332;
      --brand-beige: #F5EFE6;
      --brand-gold: #C5A059;
      --text: #2B2D2F;
      --muted: #5C636A;
      --border: #DFD8CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--brand-beige);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      background: var(--brand-green);
      color: #FFFFFF;
      padding: 14px 18px;
      border-radius: 8px;
      border-bottom: 3px solid var(--brand-gold);
      margin-bottom: 12px;
    }
    .header h1 { margin: 0; font-family: Georgia, serif; font-size: 18px; }
    .header p { margin: 4px 0 0; font-size: 12px; color: #D8E2DC; }
    .meta-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .meta-row { margin: 4px 0; }
    .meta-label { display: inline-block; width: 110px; font-weight: 700; color: var(--muted); }
    .warning-box {
      background: #FFF3CD;
      border: 1px solid #FFE69C;
      color: #664D03;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
      font-size: 12px;
    }
    .preview-frame {
      width: 100%;
      height: 280px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FFFFFF;
      margin-bottom: 12px;
    }
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: none;
      font-weight: 600;
    }
    .status-ok { background: #D4EDDA; color: #155724; border: 1px solid #A3CFBB; }
    .status-err { background: #F8D7DA; color: #721C24; border: 1px solid #F1AEB5; }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .quota { font-size: 11px; color: var(--muted); }
    .actions { display: flex; gap: 10px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-cancel { background: #E2E3E5; color: var(--text); }
    .btn-send { background: var(--brand-green); color: #FFFFFF; }
    a { color: var(--brand-green); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Send Reservation Endorsement?</h1>
    <p>You are about to send the reservation endorsement certificate to the guest below. Are you sure you want to proceed?</p>
  </div>

  <div id="retryWarning" class="warning-box"></div>
  <div id="statusBox" class="status"></div>

  <div class="meta-card">
    <div class="meta-row"><span class="meta-label">Guest:</span><span id="guestName"></span></div>
    <div class="meta-row"><span class="meta-label">Email:</span><span id="recipientEmail"></span></div>
    <div class="meta-row"><span class="meta-label">Reference:</span><strong id="referenceNumber"></strong></div>
    <div class="meta-row"><span class="meta-label">Subject:</span><span id="emailSubject"></span></div>
    <div class="meta-row">
      <span class="meta-label">Attachment:</span>
      <span id="pdfFileName"></span>
      (<a id="pdfLink" target="_blank" rel="noopener noreferrer">Preview PDF</a>)
    </div>
  </div>

  <iframe id="emailPreviewFrame" class="preview-frame" sandbox="" title="Endorsement Email Preview"></iframe>

  <div class="footer-bar">
    <div id="quotaLabel" class="quota"></div>
    <div class="actions">
      <button id="cancelBtn" class="btn-cancel" type="button">CANCEL</button>
      <button id="sendBtn" class="btn-send" type="button">SEND EMAIL</button>
    </div>
  </div>

  <script>
    var PREVIEW = <?!= previewJson ?>;

    function isSafeGoogleUrl(url) {
      return typeof url === 'string' && /^https:\/\/(drive|docs)\.google\.com\//i.test(url.trim());
    }

    document.getElementById('guestName').textContent = PREVIEW.guestName || '';
    document.getElementById('recipientEmail').textContent = PREVIEW.recipientEmail || '';
    document.getElementById('referenceNumber').textContent = PREVIEW.referenceNumber || '';
    document.getElementById('emailSubject').textContent = PREVIEW.subject || '';
    document.getElementById('pdfFileName').textContent = PREVIEW.pdfFileName || '';

    var pdfLink = document.getElementById('pdfLink');
    if (isSafeGoogleUrl(PREVIEW.pdfFileUrl)) {
      pdfLink.href = PREVIEW.pdfFileUrl.trim();
    } else {
      pdfLink.removeAttribute('href');
      pdfLink.textContent = 'Preview unavailable';
    }

    var quotaText = (typeof PREVIEW.remainingQuota === 'number' && PREVIEW.remainingQuota >= 0)
      ? String(PREVIEW.remainingQuota)
      : 'Quota check unavailable';
    document.getElementById('quotaLabel').textContent = 'Remaining Daily Gmail Quota: ' + quotaText;

    function showRetryBanner(errDetail) {
      var warn = document.getElementById('retryWarning');
      warn.textContent = 'Manual Retry Warning: A previous email delivery attempt FAILED (' +
        (errDetail || 'unknown error') + '). Click SEND EMAIL to retry manually.';
      warn.style.display = 'block';
    }

    if (PREVIEW.isRetryAfterFailure) {
      showRetryBanner(PREVIEW.lastError);
    }

    document.getElementById('emailPreviewFrame').srcdoc = PREVIEW.htmlBody || '';

    var cancelBtn = document.getElementById('cancelBtn');
    var sendBtn = document.getElementById('sendBtn');
    var statusBox = document.getElementById('statusBox');

    function showStatus(msg, isError) {
      statusBox.className = 'status ' + (isError ? 'status-err' : 'status-ok');
      statusBox.textContent = msg;
      statusBox.style.display = 'block';
    }

    cancelBtn.onclick = function () {
      google.script.host.close();
    };

    sendBtn.onclick = function () {
      sendBtn.disabled = true;
      cancelBtn.disabled = true;
      sendBtn.textContent = 'SENDING...';

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.ok) {
            showStatus(result.message || 'Endorsement email sent successfully!', false);
            sendBtn.textContent = 'SENT';
            setTimeout(function () { google.script.host.close(); }, 1300);
          } else {
            sendBtn.disabled = false;
            cancelBtn.disabled = false;
            sendBtn.textContent = 'SEND EMAIL';
            var msg = (result && result.message) || 'Email delivery failed.';
            if (result && (result.code === 'ERR_EMAIL_SEND_FAILED' || result.code === 'ERR_QUOTA_EXCEEDED')) {
              PREVIEW.isRetryAfterFailure = true;
              PREVIEW.lastError = msg;
              showRetryBanner(msg);
            }
            showStatus(msg, true);
          }
        })
        .withFailureHandler(function (err) {
          sendBtn.disabled = false;
          cancelBtn.disabled = false;
          sendBtn.textContent = 'SEND EMAIL';
          showStatus((err && err.message) || String(err), true);
        })
        .apiSendEndorsementEmail(PREVIEW.reservationId, Boolean(PREVIEW.isRetryAfterFailure));
    };
  </script>
</body>
</html>
